services:
  cybermois:
    build: .
    container_name: cybermois
    restart: unless-stopped
    env_file: .env
    ports:
      # Exposition sur la boucle locale uniquement : Nginx Proxy Manager assure le HTTPS
      - "127.0.0.1:3000:3000"
    volumes:
      - ./data:/app/data
      - ./certs:/app/certs:ro
      # Contenus editables sans reconstruire l'image
      - ./content:/app/content:ro
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/sante').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
