# ============================================================================
#  Cybermois — stack Portainer (Web editor)
#
#  Conventions reprises des piles bolt et oxidized :
#    - réseau partagé « containers-lan », rejoint par Nginx Proxy Manager
#    - données montées depuis /srv/docker/<app>, sauvegardées avec
#      le reste sans passer par docker volume
#    - aucun port publié : NPM joint le conteneur par http://cybermois:3000
#
#  Avant le premier déploiement, sur l'hôte :
#
#    mkdir -p /srv/docker/cybermois/data
#    chown -R 10001:10001 /srv/docker/cybermois/data
#
#  Le chown n'est pas une précaution de style : le conteneur tourne en
#  utilisateur non privilégié (UID 10001), et un dossier appartenant à root
#  ferait échouer l'écriture de la base au premier défi joué.
#
#  L'image se construit sur le serveur depuis le clone git, comme pour bolt :
#
#    cd /srv/docker/cybermois/app && git pull
#    docker build -t cybermois:local .
#
#  puis coller ce fichier dans Portainer → Stacks → Web editor.
#
#  Mise à jour : git pull + docker build sur le serveur, puis « Update the
#  stack » dans Portainer — SANS cocher « Re-pull image and redeploy », qui
#  chercherait l'image dans un registre où elle n'est pas.
#
#  ---------------------------------------------------------------------------
#  UNE SEULE variable est OBLIGATOIRE dans Portainer : SESSION_SECRET.
#  Sans elle, le conteneur refuse de démarrer et boucle en redémarrage.
#  PROXY_DE_CONFIANCE est fortement recommandée derrière Nginx Proxy Manager.
#
#  Tout le reste — annuaire, mot de passe du compte de service, messagerie,
#  dates de campagne, administrateurs — se règle dans l'application, à
#  Administration → Configuration, et vit en base. Les mots de passe y sont
#  chiffrés en AES-256-GCM et ne sont jamais renvoyés au navigateur : ils
#  n'ont donc rien à faire en clair dans une pile Portainer.
#
#  C'est aussi ce qui permet de rejouer la campagne l'année suivante sans
#  toucher au déploiement : les dates se changent dans l'application.
#  ---------------------------------------------------------------------------
# ============================================================================

services:
  cybermois:
    image: cybermois:local
    # L'image est construite sur ce serveur, elle n'existe dans aucun registre.
    # Sans cette ligne, « Re-pull image and redeploy » dans Portainer tente
    # d'aller la chercher sur Docker Hub et echoue sur un « pull access denied »
    # deroutant.
    pull_policy: never
    container_name: cybermois
    restart: unless-stopped

    environment:
      NODE_ENV: production
      PORT: 3000
      TZ: Europe/Paris

      # Chiffre les secrets enregistrés depuis la page de configuration, et
      # signe les cookies de session. À générer UNE FOIS (openssl rand -base64 48)
      # puis à ne plus changer : la modifier déconnecte tout le monde et rend
      # les mots de passe enregistrés illisibles.
      #
      # En NODE_ENV=production, l'application REFUSE DE DÉMARRER si ce secret
      # est absent, s'il vaut la valeur de développement par défaut, ou s'il
      # fait moins de 32 caractères. Ne jamais le commiter, ni le recopier dans
      # un ticket : il donne accès, avec une copie de la base, au mot de passe
      # du compte de service Active Directory.
      SESSION_SECRET: ${SESSION_SECRET:?definir SESSION_SECRET (32 caracteres minimum)}

      # Adresse publique du portail. Elle alimente les liens des mails et
      # conditionne le drapeau « secure » du cookie de session. Elle se corrige
      # aussi depuis l'application.
      PUBLIC_URL: ${PUBLIC_URL:-https://cybermois.chatillon92.fr}

      # Compte administrateur local, seule porte d'entrée tant que l'annuaire
      # n'est pas réglé. Laissé vide, le mot de passe est généré au premier
      # démarrage et affiché UNE SEULE FOIS dans les journaux du conteneur.
      # Pour le redéfinir ensuite :
      #   docker exec -it cybermois npm run admin -- definir admin "…"
      ADMIN_LOCAL_LOGIN: ${ADMIN_LOCAL_LOGIN:-admin}
      ADMIN_LOCAL_MOT_DE_PASSE: ${ADMIN_LOCAL_MOT_DE_PASSE:-}

      # Certificat de l'autorité interne. Ce chemin dépend du montage ci-dessous,
      # pas de la campagne : il reste ici plutôt qu'en base.
      # ATTENTION : la valeur diffère selon la pile. Ici le dossier d'AC de
      # l'hôte est monté sur /certs, d'où /certs/ca.pem ; docker-compose.yml
      # monte ./certs sur /app/certs, d'où /app/certs/ca-interne.crt.
      LDAP_CA_FILE: ${LDAP_CA_FILE:-/certs/ca.pem}

      # Adresses IP ou plages CIDR du reverse proxy, séparées par des virgules.
      # VIDE (défaut) = les en-têtes X-Forwarded-For et X-Forwarded-Proto sont
      # IGNORÉS, d'où qu'ils viennent : le journal porte alors l'adresse de
      # Nginx Proxy Manager pour tous les agents. Renseigner la plage du réseau
      # containers-lan pour retrouver l'adresse réelle des agents :
      #   docker network inspect containers-lan --format '{{range .IPAM.Config}}{{.Subnet}}{{end}}'
      # N'y déclarer que des adresses maîtrisées : une plage trop large permet à
      # n'importe quel client de choisir l'adresse qui figurera au journal.
      PROXY_DE_CONFIANCE: ${PROXY_DE_CONFIANCE:-}

      # Durées de conservation appliquées par la purge automatique, en jours.
      # Elles correspondent aux durées annoncées dans les mentions légales :
      # journaux 6 mois, résultats nominatifs jusqu'à la fin de l'année civile
      # suivant la campagne, preuves de participation agrégées 3 ans.
      # Ne les modifier qu'avec l'accord de la DPO, et en mettant à jour la
      # notice d'information.
      RETENTION_JOURNAL_JOURS: ${RETENTION_JOURNAL_JOURS:-180}
      RETENTION_RESULTATS_JOURS: ${RETENTION_RESULTATS_JOURS:-456}
      RETENTION_PREUVES_JOURS: ${RETENTION_PREUVES_JOURS:-1095}

    volumes:
      # Base SQLite. C'est la SEULE donnée à sauvegarder : le paramétrage du
      # classement se rejoue depuis parametrage/, embarqué dans l'image.
      #
      # ATTENTION : SQLite tourne en mode WAL. Une archive de ce dossier prise
      # pendant que le conteneur tourne peut être incohérente (une partie des
      # écritures validées est encore dans cybermois.db-wal). La sauvegarde de
      # référence se fait par VACUUM INTO, vers data/sauvegardes/ :
      # voir docs/exploitation.md.
      - /srv/docker/cybermois/data:/app/data
      # Autorité de certification interne, partagée avec bolt
      - /srv/docker/ca-interne:/certs:ro

    networks:
      - containers-lan

    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/sante').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    labels:
      org.opencontainers.image.title: "Cybermois"
      org.opencontainers.image.description: "Portail de sensibilisation cyber - Ville de Chatillon"

networks:
  # Le pont commun, déjà utilisé par nginx-proxy-manager, bolt et oxidized.
  containers-lan:
    external: true
