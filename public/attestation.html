<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mon attestation — Cybermois — Ville de Châtillon</title>
<link rel="stylesheet" href="/css/theme.css">
<link rel="icon" href="/img/logo.png">
<style>
  .attestation {
    background: #fff; color: #14211c; border: 3px solid #006e46; border-radius: 4px;
    padding: 3rem 2.5rem; text-align: center; position: relative; max-width: 760px; margin: 0 auto;
    box-shadow: var(--ombre-forte);
  }
  .attestation::before {
    content: ''; position: absolute; inset: 10px; border: 1px solid #aec80c; border-radius: 2px; pointer-events: none;
  }
  .attestation img.logo { height: 90px; width: auto; margin-bottom: 1rem; }
  .attestation .surtitre { font-family: 'Montserrat', Arial, sans-serif; font-size: .75rem; font-weight: 700; letter-spacing: .2em; text-transform: uppercase; color: #5f6d00; }
  .attestation h1 { font-family: 'Montserrat', Arial, sans-serif; font-size: 2rem; font-weight: 900; color: #006e46; margin: .3em 0; }
  .attestation .nom-agent { font-family: 'Montserrat', Arial, sans-serif; font-size: 1.9rem; font-weight: 700; color: #14211c; margin: 1.5rem 0 .2rem; }
  .attestation .service-agent { font-size: 1.05rem; color: #4a5a53; font-style: italic; }
  .attestation .corps { font-size: 1.05rem; line-height: 1.8; max-width: 52ch; margin: 1.8rem auto; }
  .attestation .chiffres { display: flex; justify-content: center; gap: 2.5rem; flex-wrap: wrap; margin: 2rem 0; }
  .attestation .chiffre .v { font-family: 'Montserrat', Arial, sans-serif; font-size: 2rem; font-weight: 900; color: #006e46; line-height: 1; }
  .attestation .chiffre .l { font-family: 'Montserrat', Arial, sans-serif; font-size: .75rem; color: #4a5a53; text-transform: uppercase; letter-spacing: .08em; }
  .attestation .badges-att { font-size: 1.6rem; letter-spacing: .3rem; margin: 1.2rem 0; }
  .attestation .signature { margin-top: 2.5rem; font-size: .88rem; color: #4a5a53; line-height: 1.7; }
  .attestation .signature strong { font-family: 'Montserrat', Arial, sans-serif; color: #14211c; }

  @media print {
    .entete-site, .pied-site, .actions-impression, .evitement { display: none !important; }
    body { background: #fff; }
    main { padding: 0; }
    .attestation { border-width: 3px; box-shadow: none; page-break-inside: avoid; }
  }
</style>
</head>
<body>
<a class="evitement" href="#contenu">Aller au contenu principal</a>
<div id="entete"></div>

<main id="contenu">
  <div class="conteneur">
    <div id="alerte"></div>
    <div class="actions-impression rang" style="justify-content:center;margin-bottom:1.5rem">
      <button class="btn btn-principal" id="btn-imprimer">🖨️ Imprimer ou enregistrer en PDF</button>
      <a class="btn btn-secondaire" href="/profil">Retour au profil</a>
    </div>
    <div id="zone"><p class="discret centre">Chargement…</p></div>
  </div>
</main>

<div id="pied"></div>
<script type="module" src="/js/attestation.js"></script>
</body>
</html>
