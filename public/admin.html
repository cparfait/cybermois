<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Administration — Cybermois — Ville de Châtillon</title>
<link rel="stylesheet" href="/css/theme.css">
<link rel="icon" href="/img/logo-chatillon.jpg">
<style>
  .onglets { display: flex; gap: .3rem; border-bottom: 2px solid var(--bordure); margin: 1.5rem 0 1.5rem; flex-wrap: wrap; }
  .onglets button {
    font-family: var(--police-ui); font-weight: 700; font-size: .92rem; background: none;
    border: none; border-bottom: 3px solid transparent; padding: .75rem 1.1rem;
    cursor: pointer; color: var(--encre-douce); margin-bottom: -2px;
  }
  .onglets button[aria-selected="true"] { color: var(--vert-fonce); border-bottom-color: var(--vert-fonce); }

  .stat-admin { background: var(--surface); border: 1px solid var(--bordure); border-radius: var(--rayon); padding: 1.1rem; }
  .stat-admin .v { font-family: var(--police-titre); font-weight: 900; font-size: 1.9rem; color: var(--vert-fonce); line-height: 1; }
  .stat-admin .l { font-family: var(--police-ui); font-size: .78rem; color: var(--encre-douce); margin-top: .3rem; }

  /* Une tuile qui ouvre un detail doit se signaler comme telle, sans devenir
     un bouton vert de plus : le releve reste lisible d'un coup d'oeil. */
  .stat-cliquable { cursor: pointer; text-align: left; width: 100%; font: inherit;
    transition: border-color .15s, box-shadow .15s, transform .15s; }
  .stat-cliquable:hover, .stat-cliquable:focus-visible {
    border-color: var(--vert-fonce); box-shadow: 0 2px 8px rgba(0, 110, 70, .14); transform: translateY(-1px); }

  /* Le nom d'un service ouvre sa composition : c'est un declencheur, pas un
     lien de navigation, d'ou le bouton. */
  .lien-service { background: none; border: 0; padding: 0; font: inherit; font-weight: 700;
    color: var(--vert-fonce); cursor: pointer; text-align: inherit;
    text-decoration: underline; text-underline-offset: .18em;
    text-decoration-color: var(--bordure); }
  .lien-service:hover, .lien-service:focus-visible { text-decoration-color: currentColor; }
  td.num .lien-service { font-weight: 400; }

  /* Boite de dialogue : le fond assombri vient du navigateur, on ne redefinit
     que ce qui doit s'accorder au reste de l'administration. */
  dialog::backdrop { background: rgba(0, 0, 0, .45); }
  dialog { background: var(--surface); color: var(--encre); }

  @media (prefers-reduced-motion: reduce) {
    .stat-cliquable { transition: none; }
    .stat-cliquable:hover, .stat-cliquable:focus-visible { transform: none; }
  }

  /* Bandeau de statistiques compact : sept tuiles sur deux rangees aeraient
     l'ecran sans rien apprendre de plus. Elles tiennent sur une seule ligne
     des que la fenetre le permet. */
  .bandeau-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(132px, 1fr)); gap: .6rem; }
  .bandeau-stats .stat-admin { padding: .7rem .8rem; }
  .bandeau-stats .stat-admin .v { font-size: 1.4rem; }
  .bandeau-stats .stat-admin .l { font-size: .72rem; margin-top: .15rem; line-height: 1.25; }

  /* Barre d'outils : tout sur une ligne, qui se replie proprement */
  .barre-outils { display: flex; flex-wrap: wrap; gap: .5rem; align-items: center; }
  .barre-outils .btn { padding: .55rem 1rem; font-size: .88rem; }

  .barre-filtres { display: flex; flex-wrap: wrap; gap: .8rem; align-items: flex-end; }
  .barre-filtres .champ-admin { margin-bottom: 0; }

  /* Tuile cliquable : le chiffre EST le filtre, il n'y a pas de raison de
     faire chercher ailleurs le moyen d'afficher les agents qu'il compte. */
  .stat-cliquable {
    display: block; width: 100%; text-align: left; cursor: pointer;
    font: inherit; transition: border-color var(--transition), background var(--transition);
  }
  .stat-cliquable .v, .stat-cliquable .l { display: block; }
  .stat-cliquable:hover { border-color: var(--vert-fonce); background: var(--vert-fonce-clair); }
  .stat-cliquable.stat-active {
    border-color: var(--vert-fonce); border-width: 2px;
    background: var(--vert-fonce-clair); box-shadow: var(--ombre);
  }
  .stat-cliquable.stat-active .l { color: var(--vert-fonce); font-weight: 700; }

  table.admin { width: 100%; border-collapse: collapse; font-family: var(--police-ui); font-size: .88rem; }
  table.admin th { text-align: left; font-size: .72rem; letter-spacing: .06em; text-transform: uppercase; color: var(--encre-douce); padding: .6rem .5rem; border-bottom: 2px solid var(--bordure); }
  table.admin td { padding: .6rem .5rem; border-bottom: 1px solid var(--bordure); vertical-align: top; }

  /* Liste des agents : a 600 lignes, chaque retour a la ligne inutile coute
     un ecran de defilement. On borne les colonnes et on tronque proprement. */
  table.agents td, table.agents th { vertical-align: middle; }
  table.agents .col-service { max-width: 190px; }
  table.agents .col-adresse { max-width: 230px; }
  .tronque {
    display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  table.agents .pastille-etat { white-space: nowrap; }
  table.agents .actions { white-space: nowrap; text-align: right; }

  /* Le service est un point d'entree, pas un simple libelle : on cherche
     souvent « qui est dans ce service » depuis une ligne d'agent. */
  .lien-service {
    background: none; border: none; padding: 0; text-align: left; width: 100%;
    font: inherit; color: var(--vert-fonce); cursor: pointer;
    text-decoration: underline; text-decoration-style: dotted;
    text-underline-offset: 3px;
  }
  .lien-service:hover { color: var(--vert-fonce-sombre); text-decoration-style: solid; }
  .num { text-align: right; white-space: nowrap; }

  .pastille-etat { display: inline-block; padding: .15rem .55rem; border-radius: 20px; font-size: .74rem; font-weight: 700; }
  .etat-ok { background: var(--succes-fond); color: var(--succes); }
  .etat-ko { background: var(--erreur-fond); color: var(--erreur); }

  .editeur-question { border: 1px solid var(--bordure); border-radius: var(--rayon); padding: 1.2rem; margin-bottom: 1rem; background: var(--surface); }
  .editeur-question textarea { min-height: 60px; resize: vertical; font-family: var(--police-ui); }
  .ligne-reponse { display: flex; gap: .6rem; align-items: center; margin-bottom: .5rem; }
  .ligne-reponse input[type="text"] { flex: 1; }
  .ligne-reponse input[type="checkbox"] { width: 20px; height: 20px; flex: 0 0 auto; accent-color: var(--vert-fonce); }
  .champ-admin { margin-bottom: .9rem; }
  .apercu-mail { border: 1px solid var(--bordure); border-radius: var(--rayon); width: 100%; height: 620px; background: #fff; }
  details.aide-admin { background: var(--vert-fonce-clair); border-radius: var(--rayon-sm); padding: .9rem 1.1rem; margin-bottom: 1.2rem; font-family: var(--police-ui); font-size: .88rem; }
  details.aide-admin summary { cursor: pointer; font-weight: 700; }
  code.bloc { display: block; background: var(--vert-fonce-clair); padding: .8rem; border-radius: var(--rayon-sm); font-size: .82rem; overflow-x: auto; white-space: pre-wrap; word-break: break-all; }
</style>
</head>
<body>
<a class="evitement" href="#contenu">Aller au contenu principal</a>
<div id="entete"></div>

<main id="contenu">
  <div class="conteneur">
    <h1>Administration</h1>
    <div id="alerte" aria-live="polite"></div>

    <div class="onglets" role="tablist">
      <button role="tab" id="onglet-suivi" aria-selected="true">Suivi</button>
      <button role="tab" id="onglet-defis" aria-selected="false">Défis</button>
      <button role="tab" id="onglet-agents" aria-selected="false">Agents</button>
      <button role="tab" id="onglet-mails" aria-selected="false">Mails</button>
      <button role="tab" id="onglet-exports" aria-selected="false">Exports</button>
      <button role="tab" id="onglet-configuration" aria-selected="false">Configuration</button>
      <button role="tab" id="onglet-technique" aria-selected="false">Technique</button>
    </div>

    <section role="tabpanel" id="panneau-suivi" aria-labelledby="onglet-suivi"><p class="discret">Chargement…</p></section>
    <section role="tabpanel" id="panneau-defis" aria-labelledby="onglet-defis" hidden></section>
    <section role="tabpanel" id="panneau-agents" aria-labelledby="onglet-agents" hidden></section>
    <section role="tabpanel" id="panneau-mails" aria-labelledby="onglet-mails" hidden></section>
    <section role="tabpanel" id="panneau-exports" aria-labelledby="onglet-exports" hidden></section>
    <section role="tabpanel" id="panneau-configuration" aria-labelledby="onglet-configuration" hidden></section>
    <section role="tabpanel" id="panneau-technique" aria-labelledby="onglet-technique" hidden></section>
  </div>
</main>

<div id="pied"></div>
<script type="module" src="/js/admin.js"></script>
</body>
</html>
