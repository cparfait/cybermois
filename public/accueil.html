<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Les défis — Cybermois — Ville de Châtillon</title>
<link rel="stylesheet" href="/css/theme.css">
<link rel="icon" href="/img/logo.png">
<style>
  .heros { background: var(--vert-fonce); color: #fff; border-radius: var(--rayon); padding: 2rem; margin-bottom: 2rem; position: relative; overflow: hidden; }
  .heros::after { content: ''; position: absolute; right: -60px; top: -60px; width: 240px; height: 240px; border-radius: 50%; background: var(--vert-clair); opacity: .18; }
  .heros h1, .heros p { color: #fff; position: relative; }
  .heros .surtitre { font-family: var(--police-ui); font-size: .72rem; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; opacity: .85; margin: 0; }
  .compteurs { display: flex; gap: 2rem; flex-wrap: wrap; margin-top: 1.5rem; position: relative; }
  .compteur-valeur { font-family: var(--police-titre); font-size: 2rem; font-weight: 900; line-height: 1; }
  .compteur-libelle { font-family: var(--police-ui); font-size: .8rem; opacity: .85; }

  .carte-defi { display: flex; flex-direction: column; position: relative; border-top: 5px solid var(--vert-clair); }
  .carte-defi.verrouille { opacity: .62; }

  /* Carte scellee : un defi a venir ne montre rien de son contenu, il faut
     donc que l'attente elle-meme ait l'air voulue. */
  .carte-scellee { opacity: 1; border-top-color: var(--bordure); text-align: center; }
  .carte-scellee h3 { font-size: 1.05rem; }
  .carte-scellee .accroche { font-style: italic; }

  .sceau { display: grid; place-items: center; width: 74px; height: 74px; margin: .4rem auto .8rem;
    border-radius: 50%; background: var(--fond-doux); border: 2px dashed var(--bordure);
    position: relative; }
  .sceau-icone { font-size: 2rem; line-height: 1; }

  /* Le balayage tourne lentement : il signale une attente, il ne reclame pas
     l'attention d'un agent qui lit la carte d'a cote. */
  .sceau::before { content: ''; position: absolute; inset: -6px; border-radius: 50%;
    border: 2px solid transparent; border-top-color: var(--vert-clair);
    animation: balayage 3.2s linear infinite; }

  @keyframes balayage { to { transform: rotate(360deg); } }

  @media (prefers-reduced-motion: reduce) {
    .sceau::before { animation: none; border-top-color: var(--bordure); }
  }
  .carte-defi.termine { border-top-color: var(--succes); }

  /* Le defi de la semaine : un reflet aux couleurs de la Ville glisse le long
     du bord. Le filet precedent tournait franchement et tirait l'oeil hors de
     la carte ; celui-ci se contente de la signaler.

     Le trace vient d'un degrade conique decoupe en anneau par un masque : une
     seule couche animee, et le contenu de la carte reste intact. */
  .carte-defi.a-jouer { border-top-color: var(--vert-clair); }

  .halo {
    position: absolute; inset: -1px; border-radius: inherit; z-index: 0;
    padding: 1.5px; pointer-events: none; opacity: .75;
    background: conic-gradient(from 0deg,
      transparent 0deg, transparent 250deg,
      var(--vert-clair) 300deg, var(--vert-fonce) 340deg, transparent 360deg);
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite: xor;
    mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    mask-composite: exclude;
    animation: ronde 9s linear infinite;
  }

  /* Le contenu passe devant le filet, sans quoi le degrade le traverserait. */
  .carte-defi > *:not(.halo) { position: relative; z-index: 1; }

  @keyframes ronde { to { rotate: 360deg; } }

  /* Sans mouvement, le bord garde la couleur : la carte reste distinguee, ce
     qui est le seul role de cette animation. */
  @media (prefers-reduced-motion: reduce) {
    .halo { animation: none; background: var(--vert-clair); opacity: .5; }
  }
  .numero-semaine { font-family: var(--police-ui); font-size: .72rem; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--vert-clair-texte); }
  .accroche { font-style: italic; color: var(--encre-douce); }
  .meta-defi { font-family: var(--police-ui); font-size: .82rem; color: var(--encre-douce); display: flex; gap: 1rem; flex-wrap: wrap; margin: .8rem 0 1.1rem; }
  .resultat-defi { background: var(--succes-fond); color: var(--succes); border-radius: var(--rayon-sm); padding: .7rem .9rem; font-family: var(--police-ui); font-size: .9rem; font-weight: 600; margin-bottom: 1rem; }
  .pied-carte { margin-top: auto; }

  .jauge { height: 10px; background: var(--bordure); border-radius: 5px; overflow: hidden; margin: .5rem 0 .3rem; }
  .jauge span { display: block; height: 100%; background: var(--vert-clair); border-radius: 5px; transition: width .6s ease; }
</style>
</head>
<body>
<a class="evitement" href="#contenu">Aller au contenu principal</a>
<div id="entete"></div>

<main id="contenu">
  <div class="conteneur">
    <div id="alerte"></div>
    <div id="heros"></div>
    <h2>Les défis de la campagne</h2>
    <div id="defis" class="grille grille-2" aria-live="polite">
      <p class="discret">Chargement des défis…</p>
    </div>
  </div>
</main>

<div id="pied"></div>
<script type="module" src="/js/accueil.js"></script>
</body>
</html>
